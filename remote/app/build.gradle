plugins {
    id 'com.android.application'
}

android {
    namespace 'my.glasstv.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'my.glasstv.remote'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**']
        }
    }
}

dependencies {
    // ADB over Wi-Fi, the same protocol as tools/tv.py.
    implementation 'dev.mobile:dadb:1.2.10'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
